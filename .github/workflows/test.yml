name: Test

on:
  push:
    branches: [master, beta]
  pull_request:

# A new push to the same ref supersedes the queued/in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-26-intel
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}-
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Swift tests
        # --no-parallel serializes suites; engine-level unit tests call
        # Vision in-process while integration tests spawn subprocess
        # Vision, and parallel test suites compete for the ANE.
        run: swift test --no-parallel

      - name: Lint
        run: swift format lint --strict --recursive --parallel Sources Tests
